name: App Android

# Compila la app y corre sus tests en cada PR que la toque (app-android/CLAUDE.md: "Hecho").
on:
  pull_request:
    paths:
      - "app-android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "app-android/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v4

      # Gradle y el plugin de Android corren con JDK 21 (la API usa 25).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # El runner trae el SDK de Android; se asegura la plataforma con la que se compila.
      - name: Plataforma Android 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Compilar y probar
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Resultados de los tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-app-android
          path: app-android/app/build/reports/tests/
          if-no-files-found: ignore
