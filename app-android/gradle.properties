# Memoria acotada: varios del equipo tienen 8 GB de RAM.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# URL de la API en el build release (APK firmado). En debug se usa http://10.0.2.2:8080 (emulador).
# Se puede cambiar sin tocar el código: ./gradlew assembleRelease -Pcafetin.apiUrl=https://...
cafetin.apiUrl=https://cafetin-api.onrender.com
