openapi: 3.1.0
info:
  description: |-
    API única para la app Android (estudiante) y el panel web (trabajador y dueño).
    Autenticación: `Authorization: Bearer <JWT>` obtenido en `POST /api/auth/login`.
    Errores: siempre `{codigo, mensaje, detalles}`; los clientes deciden por `codigo`.
    Precios y montos en soles (S/) con 2 decimales. Fechas y horas en hora de Lima.
  title: Gestión Cafetín — API REST
  version: 1.0.0
servers:
- description: Mismo origen de la API
  url: /
security:
- bearerAuth: []
tags:
- description: "Registro, inicio de sesión, recuperación de contraseña y perfil"
  name: Cuentas
- description: "Catálogo, carrito, pago, recibo e historial del estudiante"
  name: Pedidos
- description: "Ventas, ingresos por periodo y productos más vendidos (solo DUENO)"
  name: Ingresos
- description: Pedidos pagados y su ciclo hasta la entrega (TRABAJADOR y DUENO)
  name: Despacho
- description: "Productos, stock, alertas, categorías y proveedores (solo DUENO)"
  name: Inventario
paths:
  /api/alertas:
    get:
      description: |-
        DUENO · RF-17. Más recientes primero, con el teléfono del proveedor.
        El panel consulta cada 5 s para el contador de alertas.
      operationId: listar_6
      parameters:
      - description: false = solo pendientes (por defecto); true = solo atendidas
        in: query
        name: atendida
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertaResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: "Datos inválidos (VALIDACION, CUERPO_INVALIDO, PARAMETRO_INVALIDO)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Sin token o token inválido (NO_AUTENTICADO)
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: El rol no tiene acceso (ACCESO_DENEGADO)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Error inesperado (ERROR_INTERNO)
      summary: Listar alertas de stock
      tags:
      - Inventario
  /api/alertas/{id}/atendida:
    patch:
      description: DUENO · RF-17
      operationId: marcarAtendida
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertaResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: "Datos inválidos (VALIDACION, CUERPO_INVALIDO, PARAMETRO_INVALIDO)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Sin token o token inválido (NO_AUTENTICADO)
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: El rol no tiene acceso (ACCESO_DENEGADO)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: No existe o no te pertenece (NO_ENCONTRADO)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Error inesperado (ERROR_INTERNO)
      summary: Marcar alerta como atendida
      tags:
      - Inventario
  /api/auth/login:
    post:
      description: "Público · RF-01, RF-02. Sirve para los tres roles."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: "Datos inválidos (VALIDACION, CUERPO_INVALIDO, PARAMETRO_INVALIDO)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Correo o contraseña incorrectos (NO_AUTENTICADO)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Error inesperado (ERROR_INTERNO)
      security: []
      summary: Iniciar sesión
      tags:
      - Cuentas
  /api/auth/recuperar:
    post:
      description: |-
        Público · RF-03. Responde 202 exista o no el correo (no revela qué cuentas existen).
        En el perfil dev el enlace se escribe en el log.
      operationId: recuperar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecuperarRequest"
        required: true
      responses:
        "202":
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: "Datos inválidos (VALIDACION, CUERPO_INVALIDO, PARAMETRO_INVALIDO)"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Error inesperado (ERROR_INTERNO)
      security: []
      summary: Pedir enlace de recuperación
      tags:
      - Cuentas
  /api/auth/registro:
    post:
      description: Público · RF-01. Devuelve el token para entrar directamente.
      operationId: registrar_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistroEstudianteRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: "Datos inválidos (VALIDACION, CUERPO_INVALIDO, PARAMETRO_INVALIDO)"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Correo o código de estudiante ya registrado (CONFLICTO)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Error inesperado (ERROR_INTERNO)
      security: []
      summary: Registrar estudiante
      tags:
      - Cuentas
  /api/auth/restablecer:
    post:
      description: Público · RF-03. El token es de un solo uso y expira.
      operationId: restablecer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestablecerRequest"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: "Datos inválidos (VALIDACION, CUERPO_INVALIDO, PARAMETRO_INVALIDO)"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Token inválido o expirado (REGLA_NEGOCIO)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Error inesperado (ERROR_INTERNO)
      security: []
      summary: Restablecer contraseña
      tags:
      - Cuentas
  /api/catalogo:
    get:
      description: |-
        Autenticado (cualquier rol) · RF-04. Productos activos con su stock; incluye los AGOTADO
        para que la app los muestre deshabilitados. "Tiempo real": la app vuelve a consultar al abrir
        la pantalla y antes de pagar.
      operationId: listar_5
      parameters:
      - description: Id de categoría para filtrar
        in: query
        name: categoria
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductoCatalogoResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: "Datos inválidos (VALIDACION, CUERPO_INVALIDO, PARAMETRO_INVALIDO)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Sin token o token inválido (NO_AUTENTICADO)
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: El rol no tiene acceso (ACCESO_DENEGADO)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Error inesperado (ERROR_INTERNO)
      summary: Ver catálogo
      tags:
      - Pedidos
  /api/categorias:
    get:
      description: Autenticado (cualquier rol) · RF-04. Para los filtros del catálogo.
      operationId: listar_3
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoriaResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: "Datos inválidos (VALIDACION, CUERPO_INVALIDO, PARAMETRO_INVALIDO)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Sin token o token inválido (NO_AUTENTICADO)
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: El rol no tiene acceso (ACCESO_DENEGADO)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Error inesperado (ERROR_INTERNO)
      summary: Listar categorías activas
      tags:
      - Inventario
    post:
      description: DUENO · RF-15. 409 CONFLICTO si el nombre ya existe.
      operationId: crear_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: "Datos inválidos (VALIDACION, CUERPO_INVALIDO, PARAMETRO_INVALIDO)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Sin token o token inválido (NO_AUTENTICADO)
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: El rol no tiene acceso (ACCESO_DENEGADO)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Error inesperado (ERROR_INTERNO)
      summary: Crear categoría
      tags:
      - Inventario
  /api/categorias/{id}:
    put:
      description: DUENO · RF-15
      operationId: actualizar_2
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: "Datos inválidos (VALIDACION, CUERPO_INVALIDO, PARAMETRO_INVALIDO)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Sin token o token inválido (NO_AUTENTICADO)
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: El rol no tiene acceso (ACCESO_DENEGADO)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: No existe o no te pertenece (NO_ENCONTRADO)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Error inesperado (ERROR_INTERNO)
      summary: Editar categoría
      tags:
      - Inventario
  /api/categorias/{id}/estado:
    patch:
      description: DUENO · RF-15
      operationId: cambiarEstado_3
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstadoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: "Datos inválidos (VALIDACION, CUERPO_INVALIDO, PARAMETRO_INVALIDO)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Sin token o token inválido (NO_AUTENTICADO)
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: El rol no tiene acceso (ACCESO_DENEGADO)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: No existe o no te pertenece (NO_ENCONTRADO)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Error inesperado (ERROR_INTERNO)
      summary: Activar o desactivar categoría
      tags:
      - Inventario
  /api/despacho/pedidos:
    get:
      description: |-
        TRABAJADOR, DUENO · RF-10. Solo pedidos PAGADOS en PENDIENTE, CONFIRMADO, EN_PREPARACION o LISTO,
        ordenados por hora de recojo. El panel consulta cada 5 s.
      operationId: listar_4
      parameters:
      - description: Filtrar por un estado; vacío = todos los en curso
        in: query
        name: estado
        required: false
        schema:
          type: string
          enum:
          - PENDIENTE
          - CONFIRMADO
          - EN_PREPARACION
          - LISTO
          - ENTREGADO
          - CANCELADO
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PedidoDespachoResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: "Datos inválidos (VALIDACION, CUERPO_INVALIDO, PARAMETRO_INVALIDO)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Sin token o token inválido (NO_AUTENTICADO)
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: El rol no tiene acceso (ACCESO_DENEGADO)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Error inesperado (ERROR_INTERNO)
      summary: Pedidos en curso
      tags:
      - Despacho
  /api/despacho/pedidos/{id}/confirmar:
    post:
      description: "TRABAJADOR, DUENO · RF-11. PENDIENTE → CONFIRMADO y asigna al\
        \ usuario autenticado. Notifica al estudiante."
      operationId: confirmar
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: "Datos inválidos (VALIDACION, CUERPO_INVALIDO, PARAMETRO_INVALIDO)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Sin token o token inválido (NO_AUTENTICADO)
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: El rol no tiene acceso (ACCESO_DENEGADO)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: No existe o no te pertenece (NO_ENCONTRADO)
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Transición no permitida (TRANSICION_INVALIDA)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Error inesperado (ERROR_INTERNO)
      summary: Confirmar pedido
      tags:
      - Despacho
  /api/despacho/pedidos/{id}/entregar:
    post:
      description: "TRABAJADOR, DUENO · RF-14. LISTO → ENTREGADO; exige el recibo\
        \ verificado. Notifica al estudiante."
      operationId: entregar
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: "Datos inválidos (VALIDACION, CUERPO_INVALIDO, PARAMETRO_INVALIDO)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Sin token o token inválido (NO_AUTENTICADO)
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: El rol no tiene acceso (ACCESO_DENEGADO)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: No existe o no te pertenece (NO_ENCONTRADO)
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Recibo sin verificar (REGLA_NEGOCIO) o transición no permitida
            (TRANSICION_INVALIDA)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Error inesperado (ERROR_INTERNO)
      summary: Entregar pedido
      tags:
      - Despacho
  /api/despacho/pedidos/{id}/listo:
    post:
      description: "TRABAJADOR, DUENO · RF-12. EN_PREPARACION → LISTO. Notifica al\
        \ estudiante (M4)."
      operationId: listo
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: "Datos inválidos (VALIDACION, CUERPO_INVALIDO, PARAMETRO_INVALIDO)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Sin token o token inválido (NO_AUTENTICADO)
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: El rol no tiene acceso (ACCESO_DENEGADO)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: No existe o no te pertenece (NO_ENCONTRADO)
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Transición no permitida (TRANSICION_INVALIDA)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Error inesperado (ERROR_INTERNO)
      summary: Marcar listo para recoger
      tags:
      - Despacho
  /api/despacho/pedidos/{id}/preparar:
    post:
      description: "TRABAJADOR, DUENO · RF-11. CONFIRMADO → EN_PREPARACION."
      operationId: preparar
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: "Datos inválidos (VALIDACION, CUERPO_INVALIDO, PARAMETRO_INVALIDO)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Sin token o token inválido (NO_AUTENTICADO)
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: El rol no tiene acceso (ACCESO_DENEGADO)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: No existe o no te pertenece (NO_ENCONTRADO)
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Transición no permitida (TRANSICION_INVALIDA)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Error inesperado (ERROR_INTERNO)
      summary: Empezar a preparar
      tags:
      - Despacho
  /api/despacho/pedidos/{id}/verificar:
    post:
      description: "TRABAJADOR, DUENO · RF-13. Compara el código que muestra el estudiante\
        \ con el del recibo; el pedido debe estar LISTO."
      operationId: verificar
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificarReciboRequest"
        required: true
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: "Datos inválidos (VALIDACION, CUERPO_INVALIDO, PARAMETRO_INVALIDO)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: Sin token o token inválido (NO_AUTENTICADO)
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: El rol no tiene acceso (ACCESO_DENEGADO)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: No existe o no te pertenece (NO_ENCONTRADO)
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
          description: El código no coincide o el pedido no está LISTO (REGLA_NEGOCIO)
        "500":
          content:
