components:
  schemas:
    AlertaResponse:
      type: object
      description: "Alerta de stock generada por la base (RF-17), con el contacto\
        \ del proveedor"
      properties:
        atendida:
          type: boolean
        cantidadDisponible:
          type: integer
          format: int32
          description: Stock actual
        fecha:
          type: string
          format: date-time
        id:
          type: integer
          format: int32
        idProducto:
          type: integer
          format: int32
        mensaje:
          type: string
        nivelDetectado:
          type: integer
          format: int32
          description: Stock cuando se generó la alerta
        producto:
          type: string
        proveedor:
          type: string
        stockMinimo:
          type: integer
          format: int32
        telefonoProveedor:
          type: string
        tipo:
          type: string
          enum:
          - STOCK_BAJO
          - STOCK_AGOTADO
    CampoError:
      type: object
      description: Error de un campo
      properties:
        campo:
          type: string
          example: "items[0].cantidad"
        mensaje:
          type: string
          example: debe ser mayor que 0
    CategoriaRequest:
      type: object
      description: Alta o edición de categoría
      properties:
        descripcion:
          type: string
          maxLength: 200
          minLength: 0
        nombre:
          type: string
          example: Postres
          maxLength: 50
          minLength: 0
      required:
      - nombre
    CategoriaResponse:
      type: object
      description: Categoría de productos
      properties:
        activo:
          type: boolean
        descripcion:
          type: string
        id:
          type: integer
          format: int32
          example: 2
        nombre:
          type: string
          example: Bebidas
    CrearPedidoRequest:
      type: object
      description: Pedido armado en el carrito (RF-05)
      properties:
        horaRecojo:
          type: string
          description: "Hora de recojo elegida, formato HH:mm"
          example: 12:50
          pattern: "^\\d{2}:\\d{2}$"
        items:
          type: array
          description: "Productos del pedido, sin repetir producto"
          items:
            $ref: "#/components/schemas/ItemPedidoRequest"
          maxItems: 20
          minItems: 0
        observacion:
          type: string
          example: "Sin ají, por favor"
          maxLength: 250
          minLength: 0
      required:
      - horaRecojo
      - items
    ErrorRespuesta:
      description: Error de la API
      properties:
        codigo:
          type: string
          description: Código estable para que los clientes decidan qué hacer
          example: VALIDACION
        detalles:
          type: array
          description: Errores por campo (solo en VALIDACION); vacío en el resto
          items:
            $ref: "#/components/schemas/CampoError"
        mensaje:
          type: string
          description: Mensaje en español para mostrar al usuario
          example: Revisa los campos marcados
    EstadoRequest:
      type: object
      description: Activar o desactivar sin borrar
      properties:
        activo:
          type: boolean
          example: false
      required:
      - activo
    FcmTokenRequest:
      type: object
      description: Token de Firebase Cloud Messaging del dispositivo (RF-08)
      properties:
        token:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - token
    IngresoPeriodoResponse:
      type: object
      description: "Ingresos de un día, semana o mes (solo pagos PAGADO)"
      properties:
        ingresoTotal:
          type: number
          example: 612.5
        inicio:
          type: string
          format: date
          description: "Primer día del periodo (lunes en SEMANA, día 1 en MES)"
          example: 2026-10-26
        pedidosPagados:
          type: integer
          format: int64
          example: 57
        ticketPromedio:
          type: number
          example: 10.75
    InventarioResponse:
      type: object
      description: Stock de un producto después de la recarga
      properties:
        cantidadDisponible:
          type: integer
          format: int32
        fechaActualizacion:
          type: string
          format: date-time
        idProducto:
          type: integer
          format: int32
        producto:
          type: string
        stockMinimo:
          type: integer
          format: int32
    ItemPedidoRequest:
      type: object
      description: Línea del carrito
      properties:
        cantidad:
          type: integer
          format: int32
          example: 2
          maximum: 20
          minimum: 1
        idProducto:
          type: integer
          format: int32
          example: 7
      required:
      - cantidad
      - idProducto
    LineaDespachoResponse:
      type: object
      description: Producto a preparar
      properties:
        cantidad:
          type: integer
          format: int32
          example: 2
        producto:
          type: string
          example: Tamal criollo
    LineaPedidoResponse:
      type: object
      description: Línea del pedido con el precio al momento de la compra
      properties:
        cantidad:
          type: integer
          format: int32
          example: 2
        idProducto:
          type: integer
          format: int32
          example: 2
        nombre:
          type: string
          example: Tamal criollo
        precioUnitario:
          type: number
          example: 4.0
        subtotal:
          type: number
          example: 8.0
    LoginRequest:
      type: object
      description: "Credenciales de inicio de sesión (RF-01, RF-02)"
      properties:
        contrasena:
          type: string
          example: Cafetin2026
          minLength: 1
        correo:
          type: string
          format: email
          example: ebarreram@ucvvirtual.edu.pe
          minLength: 1
      required:
      - contrasena
      - correo
    NotificacionResponse:
      type: object
      description: Notificación del usuario (RF-08); la app las consulta al abrirse
        por si FCM se retrasa
      properties:
        fecha:
          type: string
          format: date-time
        id:
          type: integer
          format: int32
        idPedido:
          type: integer
          format: int32
          description: Pedido relacionado; nulo en alertas de stock
        leida:
          type: boolean
        mensaje:
          type: string
          example: Tu pedido PED-0426 está listo
        tipo:
          type: string
          description: "PEDIDO_CONFIRMADO, PEDIDO_LISTO, PEDIDO_ENTREGADO, PEDIDO_CANCELADO,\
            \ STOCK_BAJO o STOCK_AGOTADO"
    PagarRequest:
      type: object
      description: "Método de pago (RF-06). En la v1 solo YAPE, PLIN o TARJETA"
      properties:
        metodoPago:
          type: string
          enum:
          - YAPE
          - PLIN
          - TARJETA
          example: YAPE
      required:
      - metodoPago
    PaginaPedidoResumenResponse:
      type: object
      description: Página de resultados
      properties:
        contenido:
          type: array
          items:
            $ref: "#/components/schemas/PedidoResumenResponse"
        pagina:
          type: integer
          format: int32
          description: "Número de página, desde 0"
          example: 0
        tamano:
          type: integer
          format: int32
          example: 20
        totalElementos:
          type: integer
          format: int64
          example: 57
        totalPaginas:
          type: integer
          format: int32
          example: 3
    PaginaVentaResponse:
      type: object
      description: Página de resultados
      properties:
        contenido:
          type: array
          items:
            $ref: "#/components/schemas/VentaResponse"
        pagina:
          type: integer
          format: int32
          description: "Número de página, desde 0"
          example: 0
        tamano:
          type: integer
          format: int32
          example: 20
        totalElementos:
          type: integer
          format: int64
          example: 57
        totalPaginas:
          type: integer
          format: int32
          example: 3
    PagoResponse:
      type: object
      description: Pago del pedido
      properties:
        estado:
          type: string
          enum:
          - PENDIENTE
          - PAGADO
          - FALLIDO
          - REEMBOLSADO
        fecha:
          type: string
          format: date-time
        metodoPago:
          type: string
          enum:
          - YAPE
          - PLIN
          - TARJETA
          - EFECTIVO
        monto:
          type: number
          example: 10.5
        referencia:
          type: string
          description: Código de operación de la pasarela
          example: PL-220931
    PedidoDespachoResponse:
      type: object
      description: Pedido pagado en el tablero de despacho
      properties:
        codigoPedido:
          type: string
          example: PED-0426
        estado:
          type: string
          enum:
          - PENDIENTE
          - CONFIRMADO
          - EN_PREPARACION
          - LISTO
          - ENTREGADO
          - CANCELADO
        estudiante:
          type: string
          example: María Quiroz Vásquez
        horaRecojo:
          type: string
          example: 12:50
        idPedido:
          type: integer
          format: int32
          example: 2
        items:
          type: array
          items:
            $ref: "#/components/schemas/LineaDespachoResponse"
        metodoPago:
          type: string
          enum:
          - YAPE
          - PLIN
          - TARJETA
          - EFECTIVO
        reciboVerificado:
          type: boolean
          description: true cuando el código del recibo ya se verificó (habilita entregar)
        total:
          type: number
          example: 10.5
        trabajador:
          type: string
          description: Trabajador que lo confirmó; nulo si aún está PENDIENTE
          example: Carmen Díaz Morales
    PedidoResponse:
      type: object
      description: "Pedido con su detalle, pago y recibo"
      properties:
        codigoPedido:
          type: string
          example: PED-0426
        estado:
          type: string
          enum:
          - PENDIENTE
          - CONFIRMADO
          - EN_PREPARACION
          - LISTO
          - ENTREGADO
          - CANCELADO
        fechaHora:
          type: string
          format: date-time
        horaRecojo:
          type: string
          example: 12:50
        id:
          type: integer
          format: int32
          example: 2
        items:
          type: array
          items:
            $ref: "#/components/schemas/LineaPedidoResponse"
        observacion:
          type: string
        pago:
          $ref: "#/components/schemas/PagoResponse"
          description: Nulo si aún no se intentó pagar
        recibo:
          $ref: "#/components/schemas/ReciboResponse"
          description: Nulo hasta que el pago queda PAGADO
        total:
          type: number
          description: Calculado por la base
          example: 10.5
    PedidoResumenResponse:
      type: object
      description: Pedido en el historial (RF-09)
      properties:
        cantidadProductos:
          type: integer
          format: int32
          description: Unidades en total
          example: 2
        codigoPedido:
          type: string
          example: PED-0425
        estado:
          type: string
          enum:
          - PENDIENTE
          - CONFIRMADO
          - EN_PREPARACION
          - LISTO
          - ENTREGADO
          - CANCELADO
        estadoPago:
          type: string
          description: Nulo si nunca se intentó pagar
          enum:
          - PENDIENTE
          - PAGADO
          - FALLIDO
          - REEMBOLSADO
        fechaHora:
          type: string
          format: date-time
        horaRecojo:
          type: string
          example: 10:20
        id:
          type: integer
          format: int32
        total:
          type: number
    ProductoActualizarRequest:
      type: object
      description: "Edición de producto (RF-19). El stock se cambia con la recarga,\
        \ no aquí"
      properties:
        descripcion:
          type: string
          maxLength: 250
          minLength: 0
        idCategoria:
          type: integer
          format: int32
        idProveedor:
          type: integer
          format: int32
        imagenUrl:
          type: string
          maxLength: 300
          minLength: 0
        nombre:
          type: string
          maxLength: 100
          minLength: 0
        precio:
          type: number
          minimum: 0.01
        stockMinimo:
          type: integer
          format: int32
          minimum: 0
      required:
      - idCategoria
      - nombre
      - precio
      - stockMinimo
    ProductoCatalogoResponse:
      type: object
      description: Producto del catálogo con su disponibilidad
      properties:
        cantidadDisponible:
          type: integer
          format: int32
          example: 39
        categoria:
          type: string
          example: Bebidas
        descripcion:
          type: string
          example: Café de Chanchamayo
        estadoStock:
          type: string
          description: La app deshabilita la tarjeta si es AGOTADO
          enum:
          - DISPONIBLE
          - POCAS UNIDADES
          - AGOTADO
        idProducto:
          type: integer
          format: int32
          example: 7
        nombre:
          type: string
          example: Café pasado
        precio:
          type: number
          example: 2.5
    ProductoRequest:
      type: object
      description: Alta de producto con su stock inicial (RF-15)
      properties:
        descripcion:
          type: string
          maxLength: 250
          minLength: 0
        idCategoria:
          type: integer
          format: int32
          example: 3
        idProveedor:
          type: integer
          format: int32
          description: Nulo para productos de preparación propia
          example: 3
        imagenUrl:
          type: string
          maxLength: 300
          minLength: 0
        nombre:
          type: string
          example: Chifles 50 g
          maxLength: 100
          minLength: 0
        precio:
          type: number
          example: 2.0
          minimum: 0.01
        stockInicial:
          type: integer
          format: int32
          example: 30
          minimum: 0
        stockMinimo:
          type: integer
          format: int32
          example: 10
          minimum: 0
      required:
      - idCategoria
      - nombre
      - precio
      - stockInicial
      - stockMinimo
    ProductoResponse:
      type: object
      description: "Producto con su stock, para el panel del dueño"
      properties:
        activo:
          type: boolean
          description: false = deshabilitado por el dueño (RF-19)
        cantidadDisponible:
          type: integer
          format: int32
        categoria:
          type: string
        descripcion:
          type: string
        estadoStock:
          type: string
          enum:
          - DISPONIBLE
          - POCAS UNIDADES
          - AGOTADO
        fechaActualizacionStock:
          type: string
          format: date-time
        id:
          type: integer
          format: int32
        idCategoria:
          type: integer
          format: int32
        idProveedor:
          type: integer
          format: int32
        imagenUrl:
          type: string
        nombre:
          type: string
        precio:
          type: number
        proveedor:
          type: string
        stockMinimo:
          type: integer
          format: int32
    ProductoVendidoResponse:
      type: object
      description: Producto en el ranking de más vendidos (RF-22)
      properties:
        categoria:
          type: string
          example: Menú
        idProducto:
          type: integer
          format: int32
          example: 1
        ingresoGenerado:
          type: number
          example: 960.0
        nombre:
          type: string
          example: Menú del día
        unidadesVendidas:
          type: integer
          format: int64
          example: 120
    ProveedorRequest:
      type: object
      description: Alta o edición de proveedor
      properties:
        correo:
          type: string
          format: email
          maxLength: 120
          minLength: 0
        direccion:
          type: string
          maxLength: 200
          minLength: 0
        nombre:
          type: string
          example: Distribuidora Nor-Sur
          maxLength: 100
          minLength: 0
        telefono:
          type: string
          example: "044123456"
          minLength: 1
          pattern: "^[0-9]{6,15}$"
      required:
      - nombre
      - telefono
    ProveedorResponse:
      type: object
      description: Proveedor
      properties:
        activo:
          type: boolean
        correo:
          type: string
        direccion:
          type: string
        id:
          type: integer
          format: int32
        nombre:
          type: string
        telefono:
          type: string
    RecargaRequest:
      type: object
      description: "Recarga manual de stock (RF-18): suma unidades a las disponibles"
      properties:
        cantidad:
          type: integer
          format: int32
          description: Unidades que se agregan
          example: 24
          exclusiveMinimum: 0
      required:
      - cantidad
    ReciboResponse:
      type: object
      description: "Recibo digital (RF-07): el estudiante muestra el código al recoger"
      properties:
        codigoVerificacion:
          type: string
          example: DR-0426-3390
        fechaEmision:
          type: string
          format: date-time
        verificado:
          type: boolean
    RecuperarRequest:
      type: object
      description: Pedir el enlace de recuperación de contraseña (RF-03)
      properties:
        correo:
          type: string
          format: email
          example: ebarreram@ucvvirtual.edu.pe
          minLength: 1
      required:
      - correo
    RegistroEstudianteRequest:
      type: object
      description: Registro de un estudiante (RF-01)
      properties:
        apellidos:
          type: string
          example: Barrera Martínez
          maxLength: 80
          minLength: 0
        carrera:
          type: string
          example: Ingeniería de Sistemas
          maxLength: 80
          minLength: 0
        ciclo:
          type: integer
          format: int32
          example: 6
          maximum: 12
          minimum: 1
        codigo:
          type: string
          description: Código de estudiante
          example: "2021045678"
          maxLength: 15
          minLength: 0
        contrasena:
          type: string
          example: Cafetin2026
          maxLength: 72
          minLength: 8
        correo:
          type: string
          format: email
          example: ebarreram@ucvvirtual.edu.pe
          maxLength: 120
          minLength: 0
        nombre:
          type: string
          example: Eliú
          maxLength: 60
          minLength: 2
        telefono:
          type: string
          example: "914567890"
          pattern: "^[0-9]{9}$"
      required:
      - apellidos
      - carrera
      - ciclo
      - codigo
      - contrasena
      - correo
      - nombre
    RestablecerRequest:
      type: object
      description: Fijar una nueva contraseña con el token recibido (RF-03)
      properties:
        nuevaContrasena:
          type: string
          maxLength: 72
          minLength: 8
        token:
          type: string
          description: Token del enlace de recuperación
          minLength: 1
      required:
      - nuevaContrasena
      - token
    TokenResponse:
      type: object
      description: Token JWT y datos del usuario
      properties:
        expiraEn:
          type: integer
          format: int64
          description: Segundos hasta que el token expira
          example: 28800
        token:
          type: string
          description: "JWT para el encabezado Authorization: Bearer"
        usuario:
          $ref: "#/components/schemas/UsuarioResponse"
    TrabajadorRequest:
      type: object
      description: Alta de un trabajador por el dueño (RF-02)
      properties:
        apellidos:
          type: string
          example: Díaz Morales
          maxLength: 80
          minLength: 0
        codigoEmpleado:
          type: string
          example: TRB-003
          maxLength: 15
          minLength: 0
        contrasena:
          type: string
          description: Contraseña inicial
          maxLength: 72
          minLength: 8
        correo:
          type: string
          format: email
          example: carmen.diaz@cafetin.pe
          maxLength: 120
          minLength: 0
        nombre:
          type: string
          example: Carmen
          maxLength: 60
          minLength: 2
        telefono:
          type: string
          pattern: "^[0-9]{9}$"
        turno:
          type: string
          enum:
          - MANANA
          - TARDE
          - NOCHE
      required:
      - apellidos
      - codigoEmpleado
      - contrasena
      - correo
      - nombre
      - turno
    TrabajadorResponse:
      type: object
      description: Trabajador registrado
      properties:
        activo:
          type: boolean
        apellidos:
          type: string
        codigoEmpleado:
          type: string
        correo:
          type: string
        fechaIngreso:
          type: string
          format: date
        id:
          type: integer
          format: int32
        nombre:
          type: string
        telefono:
          type: string
        turno:
          type: string
          enum:
          - MANANA
          - TARDE
          - NOCHE
    UsuarioResponse:
      type: object
      description: Usuario autenticado
      properties:
        apellidos:
          type: string
          example: Barrera Martínez
        correo:
          type: string
          example: ebarreram@ucvvirtual.edu.pe
        id:
          type: integer
          format: int32
          example: 4
        nombre:
          type: string
          example: Eliú
        rol:
          type: string
          description: "Rol: decide el menú en el panel y el acceso en la API"
          enum:
          - ESTUDIANTE
          - TRABAJADOR
          - DUENO
    VentaResponse:
      type: object
      description: "Venta registrada (RF-20): un pago PAGADO"
      properties:
        codigoPedido:
          type: string
          example: PED-0425
        estudiante:
          type: string
          example: Eliú Barrera Martínez
        fecha:
          type: string
          format: date-time
        idPago:
          type: integer
          format: int32
        metodoPago:
          type: string
          enum:
          - YAPE
          - PLIN
          - TARJETA
          - EFECTIVO
        monto:
          type: number
          example: 10.0
    VerificarReciboRequest:
      type: object
      description: Código que muestra el estudiante (RF-13)
      properties:
        codigoVerificacion:
          type: string
          example: DR-0426-3390
          minLength: 1
          pattern: "^DR-\\d+-\\d{4}$"
      required:
      - codigoVerificacion
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
